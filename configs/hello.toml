# Hello COM3001: made-up two-file tasks, each hiding one line that uses a name
# defined in another file. AI-written (Claude Code, 20 Nov 2026), disclosed.
#
# The current file imports the module, not the name, so the module is visible
# but the name itself must come from the other file. Names are invented so
# neither model can have memorised them.
#
# prefix      the current file up to the cursor (ends with a newline)
# line        the hidden line, including its trailing newline
# targets     cross-file names in the hidden line whose bits are reported
# definition  the file that defines them (the oracle condition)

[random]
# Unrelated code of similar length, for the random-context condition.
path = "textutils/wrap.py"
text = '''
"""Small helpers for wrapping and padding report text."""

import textwrap


def wrap_paragraph(text: str, width: int = 72) -> str:
    """Wrap a paragraph to the given width, keeping blank lines."""
    return "\n".join(textwrap.wrap(text, width=width))


def pad_right(label: str, width: int) -> str:
    """Pad a label with spaces so a column lines up."""
    return label + " " * max(0, width - len(label))
'''

